<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hybrid QR Scanner</title>
    <!-- Include Streamlit component API -->
    <script>
        function sendToStreamlit(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data);
            window.parent.postMessage(outData, "*");
        }

        const Streamlit = {
            setComponentReady: function() {
                sendToStreamlit("streamlit:componentReady", {apiVersion: 1});
            },
            setFrameHeight: function(height) {
                sendToStreamlit("streamlit:setFrameHeight", {height: height});
            },
            setComponentValue: function(value) {
                sendToStreamlit("streamlit:setComponentValue", {value: value});
            },
            RENDER_EVENT: "streamlit:render",
            events: {
                addEventListener: function(type, callback) {
                    window.addEventListener("message", function(event) {
                        if (event.data.type === type) {
                            event.detail = event.data;
                            callback(event);
                        }
                    });
                }
            }
        };
    </script>
    <!-- Include Paul Miller fast-qr -->
    <script src="qr.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: transparent;
            color: white;
            text-align: center;
        }
        #container {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            min-height: 400px;
            background: #111;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 400px;
            object-fit: cover;
            background: #111;
        }
        #controls {
            padding: 15px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #4f46e5; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        #status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #818cf8;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn-start">Start Camera</button>
        <button id="btn-stop" disabled>Stop Camera</button>
        <div id="status">Waiting for camera...</div>
    </div>
    
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- Hidden canvas for capturing video frames -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        // Streamlit Component Initialization
        function sendHeight() {
            const h = Math.max(document.body.scrollHeight, 600);
            Streamlit.setFrameHeight(h);
        }

        function onRender(event) {
            sendHeight();
            
            // If python sends down stop_camera=True, we stop it!
            const args = event.detail.args;
            if (args && args.stop_camera === true) {
                if (isScanning) {
                    stopCamera();
                    statusTxt.innerText = "Successfully Decoded by Python!";
                }
            }
        }
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        window.addEventListener('load', sendHeight);
        
        const video = document.getElementById('video');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusTxt = document.getElementById('status');

        let camera = null;
        let isScanning = false;
        let lastSendTime = 0;

        async function startCamera() {
            try {
                lastSendTime = 0;
                statusTxt.innerText = "Requesting camera access (check browser permissions)...";
                sendHeight();
                
                // Uses Paul Miller's frontalCamera helper
                camera = await qr.dom.frontalCamera(video);
                
                btnStart.disabled = true;
                btnStop.disabled = false;
                statusTxt.innerText = "Scanning for QR Code...";
                
                // Let the video resize before starting loop
                video.onloadedmetadata = () => {
                    sendHeight();
                    hiddenCanvas.width = video.videoWidth;
                    hiddenCanvas.height = video.videoHeight;
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    
                    isScanning = true;
                    scanLoop();
                };
            } catch (err) {
                console.error(err);
                statusTxt.innerText = "Error: " + err.message;
            }
        }

        function stopCamera() {
            isScanning = false;
            if (camera) {
                camera.stop();
                camera = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusTxt.innerText = "Camera stopped.";
        }
        let lastSentHash = null;

        function hashMatrix(matrix) {
            // Simple fast hash: sample a few rows to detect if matrix changed
            if (!matrix || matrix.length === 0) return null;
            let h = matrix.length;
            const step = Math.max(1, Math.floor(matrix.length / 5));
            for (let i = 0; i < matrix.length; i += step) {
                for (let j = 0; j < matrix[i].length; j++) {
                    h = ((h << 5) - h + matrix[i][j]) | 0;
                }
            }
            return h;
        }

        function scanLoop() {
            if (!isScanning) return;
            
            const w = video.videoWidth;
            const h = video.videoHeight;
            if (w === 0 || h === 0) {
                setTimeout(scanLoop, 200);
                return;
            }

            const ctx = hiddenCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const imgData = ctx.getImageData(0, 0, w, h);

            let lastMatrix = null;
            let lastSize = 0;
            let decodeSucceeded = false;

            try {
                qr.decodeQR(imgData, {
                    imageOnDetect: (img) => {
                        const N = img.width;
                        lastSize = N;
                        lastMatrix = [];
                        
                        for (let y = 0; y < N; y++) {
                            let row = [];
                            for (let x = 0; x < N; x++) {
                                let isBlack = img.data[(y * N + x) * 4] < 128;
                                row.push(isBlack ? 1 : 0);
                            }
                            lastMatrix.push(row);
                        }
                    },
                    pointsOnDetect: (points) => {
                        const octx = overlayCanvas.getContext('2d');
                        octx.clearRect(0, 0, w, h);
                        
                        octx.strokeStyle = '#00ff00';
                        octx.lineWidth = 3;
                        
                        // Draw bounding quad around QR code
                        if (points.length >= 4) {
                            octx.beginPath();
                            octx.moveTo(points[0].x, points[0].y);
                            for (let i = 1; i < 4; i++) {
                                octx.lineTo(points[i].x, points[i].y);
                            }
                            octx.closePath();
                            octx.stroke();
                        }
                        
                        // Draw corner markers
                        octx.fillStyle = '#00ff00';
                        points.forEach(p => {
                            if (p.x !== undefined && p.y !== undefined) {
                                const r = p.moduleSize ? p.moduleSize * 1.5 : 6;
                                octx.beginPath();
                                octx.arc(p.x, p.y, r, 0, Math.PI * 2);
                                octx.fill();
                            }
                        });
                    }
                });
                
                decodeSucceeded = true;
                
            } catch (err) {
                // JS failed to decode
            }
            
            if (lastMatrix) {
                const now = Date.now();
                const matrixHash = hashMatrix(lastMatrix);
                const isNewMatrix = (matrixHash !== lastSentHash);
                
                // Throttle: send at most once per second, and only if matrix changed
                if (isNewMatrix && (now - lastSendTime > 1000)) {
                    lastSendTime = now;
                    lastSentHash = matrixHash;
                    Streamlit.setComponentValue({ matrix: lastMatrix, size: lastSize, ts: now });
                    
                    if (decodeSucceeded) {
                        statusTxt.innerText = "QR detected! Sending to Python decoder...";
                    } else {
                        statusTxt.innerText = "Ambiguous QR detected... sending to Wu's List Decoder...";
                    }
                }
            } else {
                // Clear overlay if QR lost
                const octx = overlayCanvas.getContext('2d');
                octx.clearRect(0, 0, w, h);
                lastSentHash = null;
            }

            // Scan every 150ms instead of every animation frame (~16ms) to save CPU
            setTimeout(scanLoop, 150);
        }

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        
        // Notify Streamlit we are ready
        Streamlit.setComponentReady();
        
    </script>
</body>
</html>
