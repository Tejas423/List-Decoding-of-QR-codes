<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hybrid QR Scanner</title>
    <!-- Include Streamlit component API -->
    <script>
        function sendToStreamlit(type, data) {
            const outData = Object.assign({
                isStreamlitMessage: true,
                type: type,
            }, data);
            window.parent.postMessage(outData, "*");
        }

        const Streamlit = {
            setComponentReady: function() {
                sendToStreamlit("streamlit:componentReady", {apiVersion: 1});
            },
            setFrameHeight: function(height) {
                sendToStreamlit("streamlit:setFrameHeight", {height: height});
            },
            setComponentValue: function(value) {
                sendToStreamlit("streamlit:setComponentValue", {value: value});
            },
            RENDER_EVENT: "streamlit:render",
            events: {
                addEventListener: function(type, callback) {
                    window.addEventListener("message", function(event) {
                        if (event.data.type === type) {
                            event.detail = event.data;
                            callback(event);
                        }
                    });
                }
            }
        };
    </script>
    <!-- Include Paul Miller fast-qr -->
    <script src="qr.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: transparent;
            color: white;
            text-align: center;
        }
        #container {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            min-height: 400px;
            background: #111;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 400px;
            object-fit: cover;
            background: #111;
        }
        #controls {
            padding: 15px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #4f46e5; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        #status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #818cf8;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="btn-start">Start Camera</button>
        <button id="btn-stop" disabled>Stop Camera</button>
        <div id="status">Waiting for camera...</div>
    </div>
    
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- Hidden canvas for capturing video frames -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        // Streamlit Component Initialization
        function sendHeight() {
            const h = Math.max(document.body.scrollHeight, 600);
            Streamlit.setFrameHeight(h);
        }

        function onRender(event) {
            sendHeight();
            
            // If python sends down stop_camera=True, we stop it!
            const args = event.detail.args;
            if (args && args.stop_camera === true) {
                if (isScanning) {
                    stopCamera();
                    statusTxt.innerText = "Successfully Decoded by Python!";
                }
            }
        }
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        window.addEventListener('load', sendHeight);
        
        const video = document.getElementById('video');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const overlayCanvas = document.getElementById('overlay-canvas');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusTxt = document.getElementById('status');

        let camera = null;
        let isScanning = false;
        let lastSendTime = 0;

        async function startCamera() {
            try {
                lastSendTime = 0;
                statusTxt.innerText = "Requesting camera access (check browser permissions)...";
                sendHeight();
                
                // Uses Paul Miller's frontalCamera helper
                camera = await qr.dom.frontalCamera(video);
                
                btnStart.disabled = true;
                btnStop.disabled = false;
                statusTxt.innerText = "Scanning for QR Code...";
                
                // Let the video resize before starting loop
                video.onloadedmetadata = () => {
                    sendHeight();
                    hiddenCanvas.width = video.videoWidth;
                    hiddenCanvas.height = video.videoHeight;
                    overlayCanvas.width = video.videoWidth;
                    overlayCanvas.height = video.videoHeight;
                    
                    isScanning = true;
                    scanLoop();
                };
            } catch (err) {
                console.error(err);
                statusTxt.innerText = "Error: " + err.message;
            }
        }

        function stopCamera() {
            isScanning = false;
            if (camera) {
                camera.stop();
                camera = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusTxt.innerText = "Camera stopped.";
        }

        function scanLoop() {
            if (!isScanning) return;
            
            const w = video.videoWidth;
            const h = video.videoHeight;
            if (w === 0 || h === 0) {
                requestAnimationFrame(scanLoop);
                return;
            }

            const ctx = hiddenCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, w, h);
            const imgData = ctx.getImageData(0, 0, w, h);

            let lastMatrix = null;
            let lastSize = 0;
            let decodeSucceeded = false;

            try {
                qr.decodeQR(imgData, {
                    // This is where we hook into the unwarped matrix!
                    imageOnDetect: (img) => {
                        const N = img.width;
                        lastSize = N;
                        lastMatrix = [];
                        
                        for (let y = 0; y < N; y++) {
                            let row = [];
                            for (let x = 0; x < N; x++) {
                                // Threshold at 128 to ensure robustness (fast-qr usually outputs 0 or 255)
                                let isBlack = img.data[(y * N + x) * 4] < 128;
                                row.push(isBlack ? 1 : 0);
                            }
                            lastMatrix.push(row);
                        }
                    },
                    // Draw overlay on detected finder patterns to look cool
                    pointsOnDetect: (points) => {
                        const octx = overlayCanvas.getContext('2d');
                        octx.clearRect(0, 0, w, h);
                        
                        octx.strokeStyle = '#00ff00';
                        octx.lineWidth = 4;
                        
                        // Draw target brackets around the finder patterns
                        points.forEach(p => {
                            if (p.x !== undefined && p.y !== undefined) {
                                const size = p.moduleSize ? p.moduleSize * 4 : 20;
                                octx.beginPath();
                                // Top-left corner
                                octx.moveTo(p.x - size, p.y - size/2);
                                octx.lineTo(p.x - size, p.y - size);
                                octx.lineTo(p.x - size/2, p.y - size);
                                // Top-right corner
                                octx.moveTo(p.x + size/2, p.y - size);
                                octx.lineTo(p.x + size, p.y - size);
                                octx.lineTo(p.x + size, p.y - size/2);
                                // Bottom-right corner
                                octx.moveTo(p.x + size, p.y + size/2);
                                octx.lineTo(p.x + size, p.y + size);
                                octx.lineTo(p.x + size/2, p.y + size);
                                // Bottom-left corner
                                octx.moveTo(p.x - size/2, p.y + size);
                                octx.lineTo(p.x - size, p.y + size);
                                octx.lineTo(p.x - size, p.y + size/2);
                                octx.stroke();
                            }
                        });
                    }
                });
                
                // If it reaches here, JS successfully decoded the QR code!
                decodeSucceeded = true;
                
            } catch (err) {
                // JS failed to decode (e.g. too many errors, wavy).
            }
            
            if (lastMatrix) {
                const now = Date.now();
                if (decodeSucceeded) {
                    Streamlit.setComponentValue({ matrix: lastMatrix, size: lastSize, ts: now });
                    statusTxt.innerText = "QR Detected! Decoding in Python...";
                    // DO NOT STOP CAMERA HERE so the live feed keeps going
                    // stopCamera(); 
                    // return; 
                } else if (now - lastSendTime > 1500) {
                    lastSendTime = now;
                    Streamlit.setComponentValue({ matrix: lastMatrix, size: lastSize, ts: now });
                    statusTxt.innerText = "Ambiguous QR detected... running Wu's List Decoder in background...";
                    
                    // Reset the text back to scanning after a short delay so it doesn't hang
                    setTimeout(() => {
                        if (isScanning && statusTxt.innerText.includes("Ambiguous")) {
                            statusTxt.innerText = "Scanning for QR Code...";
                        }
                    }, 1500);
                }
            } else {
                // Clear overlay if lost
                const octx = overlayCanvas.getContext('2d');
                octx.clearRect(0, 0, w, h);
            }

            requestAnimationFrame(scanLoop);
        }

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        
        // Notify Streamlit we are ready
        Streamlit.setComponentReady();
        
    </script>
</body>
</html>
